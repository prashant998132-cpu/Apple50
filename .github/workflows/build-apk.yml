name: 🤖 JARVIS APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache — package-lock.json nahi hai repo mein

      - name: 🔧 Install deps
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://apple50.vercel.app

      - name: 📱 Capacitor install + sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: 🔨 Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🚀 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "JARVIS AI v${{ github.run_number }}"
          body: |
            📲 **JARVIS AI APK**
            Install karo → Settings → Unknown sources ON
            App URL: https://apple50.vercel.app
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
