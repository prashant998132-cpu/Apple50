name: 🤖 JARVIS APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

# Fix: permissions add karo
permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 Install Capacitor
        run: |
          npm install --legacy-peer-deps --ignore-scripts 2>/dev/null || true
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: 📱 Create Android project
        run: |
          npx cap add android 2>/dev/null || true
          cat > capacitor.config.json << 'CAPEOF'
{
  "appId": "com.jarvis.ai.pranshu",
  "appName": "JARVIS AI",
  "webDir": "out",
  "server": {
    "url": "https://apple50.vercel.app",
    "cleartext": false
  }
}
CAPEOF
          npx cap sync android 2>/dev/null || true

      - name: 🔨 Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x lint
          echo "APK path check:"
          find . -name "*.apk" 2>/dev/null

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "JARVIS AI v${{ github.run_number }}"
          body: |
            📲 **JARVIS AI APK — Install karo**
            Settings → Security → Unknown sources ON
            Loads from: https://apple50.vercel.app
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
