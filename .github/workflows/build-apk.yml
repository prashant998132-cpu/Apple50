name: JARVIS APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps --ignore-scripts 2>/dev/null || true
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Setup Capacitor + Android
        run: |
          node -e "require('fs').writeFileSync('capacitor.config.json',JSON.stringify({appId:'com.jarvis.ai.pranshu',appName:'JARVIS AI',webDir:'out',server:{url:'https://apple50.vercel.app',cleartext:false}},null,2))"
          mkdir -p out && echo '<html><body></body></html>' > out/index.html
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: JARVIS AI v${{ github.run_number }}
          body: |
            JARVIS AI APK
            Install: Settings > Security > Unknown sources ON
            App: https://apple50.vercel.app
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
