<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>JARVIS — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060610;color:#e0e0ff;font-family:Inter,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;gap:0}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(0,100,120,0.8),rgba(0,20,40,0.95));border:1px solid rgba(0,212,255,0.2);box-shadow:0 0 40px rgba(0,212,255,0.1);display:flex;align-items:center;justify-content:center;animation:pulse 3s infinite;margin-bottom:24px}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(0,212,255,0.1)}50%{box-shadow:0 0 50px rgba(0,212,255,0.25)}}
.logo{font-size:13px;font-weight:900;letter-spacing:3px;color:rgba(0,212,255,0.5)}
h1{font-size:24px;font-weight:900;letter-spacing:4px;color:#00d4ff;margin-bottom:6px}
.status{display:flex;align-items:center;gap:6px;color:#ef4444;font-size:13px;margin-bottom:20px}
.dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.card{background:#0d0d1a;border:1px solid #1e1e2e;border-radius:14px;padding:16px;width:100%;max-width:320px;margin-bottom:12px}
.card h3{color:#00d4ff;font-size:11px;letter-spacing:1px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #111;font-size:13px;color:#888;cursor:pointer}
.item:last-child{border-bottom:none}
.item:active{opacity:0.7}
.item span{font-size:18px}
.retry{width:100%;max-width:320px;padding:14px;background:linear-gradient(135deg,#00d4ff,#0099cc);border:none;border-radius:12px;color:#000;font-size:15px;font-weight:900;cursor:pointer;letter-spacing:1px}
.tip{color:#333;font-size:11px;margin-top:16px;text-align:center;max-width:280px;line-height:1.6}
</style>
</head>
<body>
<div class="orb"><div class="logo">JARVIS</div></div>
<h1>OFFLINE</h1>
<div class="status"><span class="dot"></span>No internet connection</div>

<div class="card">
  <h3>CACHED FEATURES (kaam karenge)</h3>
  <div class="item" onclick="location='/'"><span>💬</span>Chat (offline replies)</div>
  <div class="item" onclick="location='/notes'"><span>📝</span>Notes & Flashcards</div>
  <div class="item" onclick="location='/reminders'"><span>⏰</span>Reminders</div>
  <div class="item" onclick="location='/target'"><span>🎯</span>Goals</div>
  <div class="item" onclick="location='/orb'"><span>🔮</span>JARVIS Orb</div>
</div>

<button class="retry" onclick="location.reload()">RETRY CONNECTION</button>

<p class="tip">Online hone par JARVIS automatically reconnect ho jayega aur sab kuch sync ho jayega.</p>

<script>
window.addEventListener('online', () => {
  document.querySelector('h1').textContent = 'BACK ONLINE';
  document.querySelector('.status').innerHTML = '<span style="color:#22c55e">&#x2713;</span> <span style="color:#22c55e">Connected!</span>';
  setTimeout(() => location.reload(), 800);
});
</script>
</body>
</html>
